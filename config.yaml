  novelty_k: [5, 10, 20]    # ana k = 10; diğerleri duyarlılık
  idf_bitis: 2018-01-01     # IDF yalnız bu tarihten önce çıkan oyunlardan (sızıntısız)
  benzer_esik: 0.6          # benzer_12ay eşiği: en yakın komşu benzerliğinin ~%5. yüzdeliği (0,63); 0,7 → %32 sıfır, 0,5 → aşırı gevşek. Sonuca bakılmadan seçildi
  icerik_boyutlari: [A_tur, B_mekanik, C_gorsel, D_tema, E_oyuncu, F_kapsam]
